<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musedog.lol — locked</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0705;
    color: #f5efe6;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,150,50,.08), transparent 70%);
    pointer-events: none;
  }
  .ember {
    position: fixed; bottom: -20px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,170,60,.9), rgba(255,120,30,0) 70%);
    animation: rise linear infinite; pointer-events: none; opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: .7; }
    100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
  }
  .gate {
    text-align: center; max-width: 420px; width: 100%;
    animation: fadein 1.2s ease;
    position: relative; z-index: 1;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .art {
    width: 220px; height: 220px; object-fit: cover;
    border-radius: 24px; margin: 0 auto 28px;
    box-shadow: 0 0 80px rgba(255,150,50,.25), 0 20px 60px rgba(0,0,0,.6);
    border: 1px solid rgba(255,180,80,.25);
    display: block;
  }
  .eyebrow { font-size: .8rem; letter-spacing: .35em; color: #ffb84d; text-transform: uppercase; margin-bottom: 12px; }
  h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: .02em; margin-bottom: 12px; }
  .sub { color: rgba(245,239,230,.65); font-size: .95rem; line-height: 1.55; margin-bottom: 28px; }
  .field { display: flex; gap: 10px; justify-content: center; }
  input {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,180,80,.35);
    border-radius: 12px; color: #f5efe6;
    font-size: 1rem; padding: 12px 16px; width: 200px;
    outline: none; text-align: center; letter-spacing: .1em;
  }
  input:focus { border-color: #ffb84d; box-shadow: 0 0 0 3px rgba(255,184,77,.15); }
  button {
    background: #ffb84d; color: #1a1206; border: none;
    border-radius: 12px; font-size: 1rem; font-weight: 700;
    padding: 12px 22px; cursor: pointer;
  }
  button:hover { background: #ffc76a; }
  .msg { min-height: 24px; margin-top: 14px; font-size: .9rem; color: #ff8a7a; }
  .msg.ok { color: #9fe6a0; }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .foot { margin-top: 36px; font-size: .75rem; color: rgba(245,239,230,.35); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <img class="art" src="gate-dog.png" alt="Muse Dog">
  <div class="eyebrow">musedog.lol</div>
  <h1>The dog house is locked.</h1>
  <p class="sub">Something is brewing behind this door.<br>The pack is building. If you've got the passcode,<br>you know what to do.</p>
  <div class="field">
    <input id="pw" type="password" placeholder="passcode" autocomplete="off" autocapitalize="off">
    <button id="go">Unlock</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="foot">built by muses, for muses.</div>
</div>
<script>
(function () {
  for (var i = 0; i < 24; i++) {
    var e = document.createElement("div");
    e.className = "ember";
    var s = 3 + Math.random() * 7;
    e.style.width = e.style.height = s + "px";
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 7 + Math.random() * 9 + "s";
    e.style.animationDelay = Math.random() * 10 + "s";
    document.body.appendChild(e);
  }
  var HASH = "8fb16cb93df1d1a63e3ca43db18473c6d4c85e26ad79f8a2b7dfd7b943c15e8a";
  var pw = document.getElementById("pw");
  var msg = document.getElementById("msg");
  var gate = document.getElementById("gate");
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  }
  function fail() {
    msg.textContent = "nope. that's not it.";
    msg.className = "msg";
    gate.classList.remove("shake");
    void gate.offsetWidth;
    gate.classList.add("shake");
  }
  function tryUnlock() {
    var val = pw.value;
    if (!val) { fail(); return; }
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(val)).then(function (buf) {
      if (hex(buf) === HASH) {
        msg.textContent = "welcome in. 🐕";
        msg.className = "msg ok";
        try { sessionStorage.setItem("musedog_unlocked", "1"); } catch (e) {}
        setTimeout(function () { location.replace("home.html"); }, 600);
      } else {
        fail();
      }
    }).catch(fail);
  }
  document.getElementById("go").addEventListener("click", tryUnlock);
  pw.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  pw.focus();
})();
</script>
</body>
</html>
